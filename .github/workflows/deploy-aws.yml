name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      region:
        description: "AWS deployment region"
        required: true
        type: choice
        options:
          - east
          - west
        default: east

      reason:
        description: "Deployment reason"
        required: true
        type: string
        default: "Manual deployment"

  push:
    branches:
      - aws-main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: leavepilot-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Application
        run: mvn clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REPOSITORY .
          docker tag $ECR_REPOSITORY:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Select EKS Cluster
        id: cluster
        run: |
          if [ "${{ github.event.inputs.region }}" = "west" ]; then
            echo "region=us-west-2" >> $GITHUB_OUTPUT
            echo "cluster=leavepilot-eks-west" >> $GITHUB_OUTPUT
          else
            echo "region=us-east-1" >> $GITHUB_OUTPUT
            echo "cluster=leavepilot-eks-east" >> $GITHUB_OUTPUT
          fi

      - name: Configure EKS Access
        run: |
          aws eks update-kubeconfig \
            --region "${{ steps.cluster.outputs.region }}" \
            --name "${{ steps.cluster.outputs.cluster }}"

      - name: Verify Cluster Connection
        run: |
          kubectl get nodes

      - name: Restart Deployment
        run: |
          kubectl rollout restart deployment/leavepilot-backend

      - name: Wait For Rollout
        run: |
          kubectl rollout status deployment/leavepilot-backend --timeout=300s

      - name: Deployment Completed
        run: |
          echo "AWS deployment completed successfully"
          echo "Cluster: ${{ steps.cluster.outputs.cluster }}"
          echo "Region: ${{ steps.cluster.outputs.region }}"
          echo "Reason: ${{ github.event.inputs.reason }}"