name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - both
          - east
          - west
        default: both

      reason:
        description: "Deployment reason"
        required: true
        type: string
        default: "Manual deployment"

  push:
    branches:
      - aws-main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: leavepilot-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Application
        run: mvn clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REPOSITORY .
          docker tag $ECR_REPOSITORY:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # EAST DEPLOYMENT

      - name: Deploy East
        if: github.event_name == 'push' || github.event.inputs.region == 'east' || github.event.inputs.region == 'both'
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name leavepilot-eks-east

          kubectl get nodes

          kubectl rollout restart deployment/leavepilot-backend

          kubectl rollout status deployment/leavepilot-backend --timeout=300s

      # WEST DEPLOYMENT

      - name: Deploy West
        if: github.event_name == 'push' || github.event.inputs.region == 'west' || github.event.inputs.region == 'both'
        run: |
          aws eks update-kubeconfig \
            --region us-west-2 \
            --name leavepilot-eks-west

          kubectl get nodes

          kubectl rollout restart deployment/leavepilot-backend

          kubectl rollout status deployment/leavepilot-backend --timeout=300s

      - name: Deployment Complete
        run: |
          echo "AWS deployment completed successfully"
