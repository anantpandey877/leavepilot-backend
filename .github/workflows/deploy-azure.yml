name: Deploy Azure

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend
        run: mvn clean package -DskipTests

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name leavepilotacr

      - name: Build Docker image
        run: |
          docker build -t leavepilotacr-gjhefhbhf3d8debx.azurecr.io/leavepilot-backend:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push leavepilotacr-gjhefhbhf3d8debx.azurecr.io/leavepilot-backend:${{ github.sha }}