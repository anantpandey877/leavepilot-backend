name: Deploy Azure

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Azure deployment region"
        required: true
        type: choice
        options:
          - central
          - south
        default: central

      reason:
        description: "Deployment reason"
        required: true
        type: string
        default: "Manual deployment"

  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and Test
        run: mvn clean verify

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name leavepilotacr

      - name: Build Docker Image
        run: |
          docker build \
            -t leavepilotacr-gjhefhbhf3d8debx.azurecr.io/leavepilot-backend:${{ github.sha }} \
            .

      - name: Push Docker Image
        run: |
          docker push \
            leavepilotacr-gjhefhbhf3d8debx.azurecr.io/leavepilot-backend:${{ github.sha }}

      - name: Select AKS Cluster
        id: cluster
        run: |
          if [ "${{ inputs.region }}" = "south" ]; then
            echo "cluster=leavepilot-aks-south" >> $GITHUB_OUTPUT
          else
            echo "cluster=leavepilot-aks" >> $GITHUB_OUTPUT
          fi

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group LeavePilot-RG \
            --name "${{ steps.cluster.outputs.cluster }}" \
            --overwrite-existing

      - name: Deploy to AKS
        run: |
          kubectl set image deployment/leavepilot-backend \
            leavepilot-backend=leavepilotacr-gjhefhbhf3d8debx.azurecr.io/leavepilot-backend:${{ github.sha }}

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/leavepilot-backend --timeout=300s

      - name: Deployment Completed
        run: |
          echo "Azure deployment completed successfully"
          echo "Region: ${{ inputs.region }}"
          echo "Reason: ${{ inputs.reason }}"